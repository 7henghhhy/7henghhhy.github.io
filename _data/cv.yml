    Projects:
      - name: Hypertension Risk Analysis and Logistic Regression
        summary: A STAT1000J data science project analyzing hypertension risk with a Python data-analysis pipeline and logistic regression.
        highlights:
          - Built a Python data-analysis pipeline for 1,985 health records, including data cleaning, categorical encoding, feature scaling, visualization, and permutation-based hypothesis testing.
          - Trained and evaluated a logistic-regression model with stratified splitting, achieving 75.31% test accuracy; analyzed feature coefficients, prediction errors, and confidence levels.
