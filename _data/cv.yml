        summary: Advised by Prof. Hesheng Wang.
        highlights:
          - Built an object-oriented visual SLAM system in Python with SIFT/ORB features, geometric matching, relative pose estimation, PnP tracking, triangulation, and sparse bundle adjustment.
          - Conducted controlled experiments on frame sampling, keyframe selection, feature density, and match filtering, comparing reprojection error, point-cloud density, and runtime across configurations.
          - Extended the pipeline toward dense 3DGS-SLAM by integrating Depth Anything V2 and ADD-SLAM, and diagnosed failures caused by limited viewpoint coverage, depth-scale inconsistency, and camera-pose drift.

      - company: Michigan Mars Rover Team (MRover)
        position: Rock Pick Pose Estimation
        location: Ann Arbor, MI
        start_date: "2026"
        end_date: Present
        summary: Keypoint-based robot perception for autonomous rock-pick retrieval.
        highlights:
          - Developing keypoint-based pose estimation from a downward-facing USB camera, with position and keypoint outputs for the grasping subsystem.
          - Built an approximately 10,000-frame dataset using CoTracker for auto-labeling and trained a YOLO-based keypoint model for rock-pick detection.
          - Integrating with the rover software stack through ROS topics and the TF tree.

      - company: Shanghai Jiao Tong University
        position: C2-MANS - Neuro-Symbolic Multi-Agent Novel Generation
        location: Shanghai, China
        start_date: Nov 2025
        end_date: Apr 2026
        summary: Advised by Prof. Jiong Lou.
        highlights:
          - Designed a CrewAI pipeline of four specialized agents with Pydantic state models to keep long-form narratives logically consistent across chapters.
          - Implemented structured state layers, including RelationshipGraph and TimeLedger, with persistent storage for autonomous generation of 10-chapter novellas.

