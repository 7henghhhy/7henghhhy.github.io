    Research Experience:
      - company: Shanghai Jiao Tong University
        position: Undergraduate Researcher
        location: Shanghai, China
        start_date: Nov 2025
        end_date: Apr 2026
        summary: Design and implementation of a distributed multi-agent system for novel generation, advised by Professor Jiong Lou.
        highlights:
          - Designed C2-MANS, a neuro-symbolic multi-agent system combining large language models with Pydantic state models for logically consistent long-form narratives.
          - Architected a CrewAI pipeline with four specialized agents, scene-level constraints, and post-generation state synchronization.
          - Developed persistent storage and structured state layers, including RelationshipGraph and TimeLedger, for autonomous 10-chapter novella generation.

      - company: Institute of Robotics and Machine Vision, Shanghai Jiao Tong University
        position: Undergraduate Research Project
        location: Shanghai, China
        start_date: Jul 2026
        end_date: Aug 2026
        summary: 3D vision and visual SLAM research project mentored by Tianchen Deng, Ph.D. student.
        highlights:
          - Built an object-oriented visual SLAM system in Python, implementing SIFT/ORB feature extraction, geometric matching, relative pose estimation, PnP tracking, triangulation, and sparse bundle adjustment.
          - Conducted controlled experiments on frame sampling, keyframe selection, feature density, and match filtering, comparing reprojection error, point-cloud density, and runtime across configurations.
          - Extended the pipeline toward dense 3DGS-SLAM by integrating Depth Anything V2 and ADD-SLAM, and diagnosed failures caused by limited viewpoint coverage, depth-scale inconsistency, and camera-pose drift.

