        summary: Design and implementation of a distributed multi-agent system for novel generation, advised by Professor Jiong Lou.
        highlights:
          - Designed C2-MANS, a neuro-symbolic multi-agent system combining large language models with Pydantic state models for logically consistent long-form narratives.
          - Architected a CrewAI pipeline with four specialized agents, scene-level constraints, and post-generation state synchronization.
          - Developed persistent storage and structured state layers, including RelationshipGraph and TimeLedger, for autonomous 10-chapter novella generation.

      - company: Institute of Robotics and Machine Vision, Shanghai Jiao Tong University
        position: Undergraduate Research Project
        location: Shanghai, China
        start_date: Jul 2026
        end_date: Aug 2026
        summary: 3D vision and visual SLAM research project mentored by Tianchen Deng.
        highlights:
          - Studied multi-view geometry, camera pose estimation, 3D reconstruction, visual SLAM, and 3D Gaussian Splatting.
          - Implemented an incremental reconstruction pipeline for 26 multi-view images using SIFT matching, relative pose estimation, triangulation, and bundle adjustment.
          - Produced an indoor-scene point cloud and analyzed reconstruction failure modes.

